[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-transporter"
version = "0.1.0"
description = "Reliably forward iCloud Mail (IMAP) messages into Gmail via the Gmail API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imapclient>=3.0,<4",
    "google-api-python-client>=2.100,<3",
    "google-auth>=2.23,<3",
    "google-auth-httplib2>=0.2",
    "google-cloud-secret-manager>=2.16,<3",
    "flask>=3.0,<4",
    "gunicorn>=21,<24",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "google-auth-oauthlib>=1.2", "pip-tools==7.6.1", "pyyaml>=6"]

[tool.setuptools.packages.find]
include = ["mailtransporter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
