name: Deploy

# Every push to main is tested, built with Cloud Build and rolled out to
# Cloud Run and the watcher MIG. Authentication uses Workload Identity
# Federation (deploy/06_github_deployer.sh); no service-account key is stored.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Cloud Build plus the Cloud Run and MIG rollouts normally finish well
    # inside this; a hang must not hold the deploy-production queue for hours.
    timeout-minutes: 30
    # Add required reviewers to this environment in the repository settings to
    # put a human approval in front of every rollout, manual runs included.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      ICLOUD_USER: ${{ vars.ICLOUD_USER }}
      REGION: ${{ vars.GCP_REGION }}
      ZONE: ${{ vars.GCP_ZONE }}
      GMAIL_LABEL: ${{ vars.GMAIL_LABEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check repository variables
        env:
          WIP: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER: ${{ vars.GCP_DEPLOYER_SA }}
        run: |
          missing=0
          for v in PROJECT_ID ICLOUD_USER WIP DEPLOYER; do
            if [ -z "${!v}" ]; then echo "::error::repository variable for $v is not set (see deploy/06_github_deployer.sh)"; missing=1; fi
          done
          exit $missing

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1

      - name: Build and roll out
        run: ./deploy/release.sh "${GITHUB_SHA::7}"
