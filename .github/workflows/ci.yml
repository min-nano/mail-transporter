name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Lock file matches pyproject.toml
        run: |
          pip-compile --quiet --no-header --generate-hashes --strip-extras --output-file requirements.txt pyproject.toml
          git diff --exit-code requirements.txt || { echo "::error::requirements.txt is out of date; regenerate it with pip-compile (see Dockerfile)"; exit 1; }
      - name: Docker build
        run: docker build -t mail-transporter:ci .
